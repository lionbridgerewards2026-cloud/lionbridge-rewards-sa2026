<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Login - LionBridge</title>
<style>
body{background:#0a0a0a;color:#FFD700;font-family:Arial;text-align:center;padding:50px}
.box{max-width:400px;margin:auto;border:2px solid #FFD700;padding:30px;border-radius:15px}
input{width:90%;padding:12px;margin:10px;border-radius:8px;border:1px solid #FFD700;background:#000;color:#FFD700}
.btn{background:#FFD700;color:#000;padding:12px 30px;border:none;border-radius:10px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
  <div class="box">
    <h1>Login</h1>
    <input type="email" placeholder="Email"><br>
    <input type="password" placeholder="Password"><br>
    <button class="btn">Login</button>
    <p><a href="signup.html" style="color:#FFD700">Don't have an account? Sign Up</a></p>
  </div>
</body>
</html>
